openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: NOVA AI assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: conversations
  - name: assistant
  - name: admin
  - name: billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already exists
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Signed out
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Message history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [assistant]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "402":
          description: Usage limit reached
  /assistant/research:
    post:
      operationId: research
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchInput"
      responses:
        "200":
          description: Research result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchResult"
  /assistant/generate-image:
    post:
      operationId: generateImage
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageInput"
      responses:
        "200":
          description: Image result or provider configuration state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResult"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      responses:
        "200":
          description: Admin dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Admin access required
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Admin access required
  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      responses:
        "200":
          description: Checkout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResult"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    User:
      type: object
      required: [id, email, role, plan, usage, usageLimit]
      properties:
        id: { type: string }
        email: { type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        name: { type: ["string", "null"] }
        role: { type: string, enum: [USER, ADMIN] }
        plan: { type: string, enum: [FREE, PREMIUM] }
        usage: { type: number }
        usageLimit: { type: number }
    AuthInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        password: { type: string, minLength: 8 }
        name: { type: string }
    Conversation:
      type: object
      required: [id, title, updatedAt, messageCount]
      properties:
        id: { type: string }
        title: { type: string }
        updatedAt: { type: string }
        messageCount: { type: number }
    ConversationInput:
      type: object
      properties:
        title: { type: string }
    Message:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        createdAt: { type: string }
        citations:
          type: array
          items: { type: string }
    MessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        mode: { type: string, enum: [chat, research, document] }
    ResearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 2 }
    ResearchResult:
      type: object
      required: [status, answer, sources]
      properties:
        status: { type: string, enum: [ready, configuration_required] }
        answer: { type: string }
        sources:
          type: array
          items: { type: string }
    ImageInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 2 }
    ProviderResult:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [ready, configuration_required] }
        message: { type: string }
        url: { type: ["string", "null"] }
    AdminOverview:
      type: object
      required: [users, premiumUsers, messagesToday, providerStatus]
      properties:
        users: { type: number }
        premiumUsers: { type: number }
        messagesToday: { type: number }
        providerStatus:
          type: object
          additionalProperties: { type: boolean }